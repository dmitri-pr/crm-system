[mypy]
python_version = 3.10
ignore_missing_imports = True
disable_error_code = var-annotated, misc
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True

[mypy-apps.*.models.*]
ignore_errors = True

[mypy-apps.*.admin.*]
ignore_errors = True

[mypy-apps.*.tests.*]
ignore_errors = True
