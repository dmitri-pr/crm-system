repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        files: ^apps/
        additional_dependencies:
          - pylint==4.0.6
          - pylint-django==2.8.0
          - Django~=5.2.16
          - psycopg2-binary==2.9.12
          - python-dotenv~=1.2.2
        args:
          - --rcfile=.pylintrc
          - --fail-under=7.0
        exclude: migrations/|tests/
